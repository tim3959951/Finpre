[project]
name = "fintech-agent"
version = "0.1.0"
description = "Multi-agent AI financial analyst for Taiwan & US markets, powered by Google TimesFM with benchmarked forecasting models"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "scikit-learn>=1.4",
    "yfinance>=0.2.50",
    "plotly>=5.20",
    "streamlit>=1.35",
]

[project.optional-dependencies]
models = [
    "torch>=2.4",
    "timesfm[torch]>=2.0",
    "chronos-forecasting>=2.0",
    "statsforecast>=1.7",
    "lightgbm>=4.3",
]
llm = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fintech_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
