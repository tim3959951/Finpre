[project]
name = "fintech-agent"
version = "1.0.0"
description = "Finpre: multi-agent AI investment research for Taiwan & US markets with walk-forward-validated forecasts, stock ranking, portfolio risk and a compliant B2B API"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "lightgbm>=4.3",           # champion forecaster and stock ranker
    "yfinance>=0.2.50",
    "plotly>=5.20",
    "streamlit>=1.35",
]

[project.optional-dependencies]
models = [
    "torch>=2.4",
    "timesfm[torch]>=2.0",
    "chronos-forecasting>=2.0",
    "statsforecast>=1.7",
    "jax>=0.4.30",        # TimesFM XReg (covariates); the timesfm[xreg] extra pins a CUDA build
    "jaxlib>=0.4.30",
]
llm = ["anthropic>=0.40", "openai>=1.50"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fintech_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
