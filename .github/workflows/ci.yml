name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: pip install -e ".[dev,api,llm]"
      - run: pytest -q
      - name: compliance wording check on the research prompts and templates
        run: python scripts/compliance_check.py
